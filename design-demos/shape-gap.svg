<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" width="960" height="604" font-family="-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect width="960" height="604" fill="#fbf9f5"/>
<text x="56" y="40" font-size="20" font-weight="600" fill="#191918">流动性断层 / 真空层：Liquidity Gap（Vacuum）</text>
<text x="56" y="64" font-size="13.5" fill="#77756f">两侧各有一堵墙，中间刻意留一条完全没有流动性的真空带，现价就在真空里</text>
<text x="56" y="86" font-size="13" fill="#98958e">柱高 = 流动性厚度 · 蓝 = 现价下方（USDG，等跌买入）· 绿 = 上方（代币，等涨卖出）· 横轴为对数价格 · 现价落在真空带</text>
<rect x="87.4" y="120.0" width="229.3" height="220.0" fill="#3565a8" opacity=".6"/><rect x="572.0" y="217.8" width="300.6" height="122.2" fill="#417a5b" opacity=".6"/>
<path d="M87.4 120.0 L316.7 120.0 M316.7 340.0 L425.6 340.0 M425.6 340.0 L572.0 340.0 M572.0 217.8 L872.6 217.8" fill="none" stroke="#d8d0c2" stroke-width="1"/>
<line x1="48" y1="340" x2="912" y2="340" stroke="#d8d0c2"/>
<line x1="425.6" y1="112" x2="425.6" y2="346" stroke="#191918" stroke-width="1.3" stroke-dasharray="4 3"/>
<rect x="316.7" y="203.6" width="255.3" height="136.4" fill="none" stroke="#9a6a2c" stroke-width="1.1" stroke-dasharray="5 4" opacity=".7"/><text x="444.3" y="227.6" text-anchor="middle" font-size="13.5" fill="#9a6a2c" stroke="#fbf9f5" stroke-width="5" paint-order="stroke">真空带：没有流动性</text>


<line x1="87.4" y1="340" x2="87.4" y2="346" stroke="#d8d0c2"/><text x="87.4" y="362" text-anchor="middle" font-size="13" fill="#191918">−50%</text>
<line x1="316.7" y1="340" x2="316.7" y2="346" stroke="#deddd7"/><text x="316.7" y="362" text-anchor="middle" font-size="13" fill="#77756f">−20%</text>
<line x1="425.6" y1="340" x2="425.6" y2="346" stroke="#d8d0c2"/><text x="425.6" y="362" text-anchor="middle" font-size="13" fill="#191918">现价</text>
<line x1="572.0" y1="340" x2="572.0" y2="346" stroke="#deddd7"/><text x="572.0" y="362" text-anchor="middle" font-size="13" fill="#77756f">+35%</text>
<line x1="872.6" y1="340" x2="872.6" y2="346" stroke="#d8d0c2"/><text x="872.6" y="362" text-anchor="middle" font-size="13" fill="#191918">+150%</text>
<path d="M87.4 376 v6 H316.7 v-6" fill="none" stroke="#3565a8" stroke-width="1.2" opacity=".55"/><text x="202.1" y="402" text-anchor="middle" font-size="13.5" fill="#3565a8">接盘墙：跌破 −20% 才买</text>
<path d="M572.0 376 v6 H872.6 v-6" fill="none" stroke="#417a5b" stroke-width="1.2" opacity=".55"/><text x="722.3" y="402" text-anchor="middle" font-size="13.5" fill="#417a5b">出货墙：涨过 +35% 才卖</text>
<line x1="56" y1="428" x2="904" y2="428" stroke="#deddd7"/>
<text x="56" y="450" font-size="13.5" fill="#191918">拆成 2 个仓位</text>
<text x="56" y="476" font-size="13.5" fill="#191918">怎么用：预判要暴力单边走：真空带里不当对手盘，价格穿过时你不亏也不赚，走到哪堵墙才接手。代价是横盘时一分手续费也没有</text>
<text x="56" y="512" font-size="13" fill="#77756f">下方接盘墙</text><rect x="228.1" y="501.0" width="132.5" height="11" rx="2" fill="#3565a8" opacity=".5"/><text x="904" y="512" text-anchor="end" font-size="12.5" fill="#98958e">−50.0% → −20.0% · 占 60%</text><text x="56" y="540" font-size="13" fill="#77756f">上方出货墙</text><rect x="508.1" y="529.0" width="173.7" height="11" rx="2" fill="#417a5b" opacity=".5"/><text x="904" y="540" text-anchor="end" font-size="12.5" fill="#98958e">+35.0% → +150.0% · 占 40%</text>
<text x="56" y="590" font-size="12.5" fill="#9a6a2c">现在做不到一键：等于两次单边进场（一次只在下方、一次只在上方）。Bid-Ask 只空含现价的那一格，空不出这么宽</text>
</svg>