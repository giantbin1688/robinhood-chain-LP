<text x="56" y="40" font-size="20" font-weight="600" fill="#191918">Bimodal / Twin Peaks：双峰（双子塔）</text>
<text x="56" y="64" font-size="13.5" fill="#77756f">两个独立的厚峰压在预期的支撑位和阻力位上，现价待在中间的薄谷底</text>
<text x="56" y="86" font-size="13" fill="#98958e">柱高 = 流动性厚度 · 蓝 = 现价下方（USDG，等跌买入）· 绿 = 上方（代币，等涨卖出）· 横轴为对数价格 · 现价落在谷底</text>
