<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect width="960" height="660" fill="#fbf9f5"/>
<text x="56" y="40" font-size="20" font-weight="600" fill="#191918">单边倾斜曲线：Skewed / Slanted Curve</text>
<text x="56" y="64" font-size="13.5" fill="#77756f">峰顶不在现价上，而是被推到一侧；一侧陡、另一侧拖着长尾</text>
<text x="56" y="86" font-size="13" fill="#98958e">柱高 = 流动性厚度 · 蓝 = 现价下方（USDG，等跌买入）· 绿 = 上方（代币，等涨卖出）· 横轴为对数价格 · 现价落在陡侧</text>
<rect x="87.4" y="285.0" width="286.8" height="55.0" fill="#3565a8" opacity=".6"/><rect x="374.2" y="230.0" width="51.4" height="110.0" fill="#3565a8" opacity=".6"/><rect x="425.6" y="230.0" width="68.2" height="110.0" fill="#417a5b" opacity=".6"/><rect x="493.8" y="175.0" width="59.8" height="165.0" fill="#417a5b" opacity=".6"/><rect x="553.6" y="120.0" width="85.8" height="220.0" fill="#417a5b" opacity=".6"/><rect x="639.4" y="175.0" width="73.0" height="165.0" fill="#417a5b" opacity=".6"/><rect x="712.3" y="230.0" width="97.9" height="110.0" fill="#417a5b" opacity=".6"/><rect x="810.2" y="285.0" width="62.4" height="55.0" fill="#417a5b" opacity=".6"/>
<path d="M87.4 285.0 L374.2 285.0 M374.2 230.0 L425.6 230.0 M425.6 230.0 L493.8 230.0 M493.8 175.0 L553.6 175.0 M553.6 120.0 L639.4 120.0 M639.4 175.0 L712.3 175.0 M712.3 230.0 L810.2 230.0 M810.2 285.0 L872.6 285.0" fill="none" stroke="#d8d0c2" stroke-width="1"/>
<line x1="48" y1="340" x2="912" y2="340" stroke="#d8d0c2"/>
<line x1="425.6" y1="112" x2="425.6" y2="346" stroke="#191918" stroke-width="1.3" stroke-dasharray="4 3"/>



<line x1="87.4" y1="340" x2="87.4" y2="346" stroke="#d8d0c2"/><text x="87.4" y="362" text-anchor="middle" font-size="13" fill="#191918">−50%</text>
<line x1="425.6" y1="340" x2="425.6" y2="346" stroke="#d8d0c2"/><text x="425.6" y="362" text-anchor="middle" font-size="13" fill="#191918">现价</text>
<line x1="553.6" y1="340" x2="553.6" y2="346" stroke="#deddd7"/><text x="553.6" y="362" text-anchor="middle" font-size="13" fill="#77756f">+30%</text>
<line x1="639.4" y1="340" x2="639.4" y2="346" stroke="#deddd7"/><text x="639.4" y="362" text-anchor="middle" font-size="13" fill="#77756f">+55%</text>
<line x1="872.6" y1="340" x2="872.6" y2="346" stroke="#d8d0c2"/><text x="872.6" y="362" text-anchor="middle" font-size="13" fill="#191918">+150%</text>
<path d="M87.4 376 v6 H553.6 v-6" fill="none" stroke="#3565a8" stroke-width="1.2" opacity=".55"/><text x="320.5" y="402" text-anchor="middle" font-size="13.5" fill="#3565a8">陡侧：跌破就很快用完</text>
<path d="M553.6 376 v6 H639.4 v-6" fill="none" stroke="#191918" stroke-width="1.2" opacity=".55"/><text x="596.5" y="402" text-anchor="middle" font-size="13.5" fill="#191918">峰顶</text>
<path d="M639.4 376 v6 H872.6 v-6" fill="none" stroke="#417a5b" stroke-width="1.2" opacity=".55"/><text x="756.0" y="402" text-anchor="middle" font-size="13.5" fill="#417a5b">长尾：涨上去慢慢卖</text>
<line x1="56" y1="428" x2="904" y2="428" stroke="#deddd7"/>
<text x="56" y="450" font-size="13.5" fill="#191918">拆成 4 个仓位</text>
<text x="56" y="476" font-size="13.5" fill="#191918">怎么用：有方向判断时用。这张是看涨版：峰顶推到 +30%~+55%，跌下去的那一侧薄（少接盘），涨上去有长尾慢慢卖</text>
<text x="56" y="512" font-size="13" fill="#77756f">第 1 层（全区间）</text><rect x="228.1" y="501.0" width="453.7" height="11" rx="2" fill="#417a5b" opacity=".5"/><text x="904" y="512" text-anchor="end" font-size="12.5" fill="#98958e">−50.0% → +150.0% · 占 51%</text><text x="56" y="540" font-size="13" fill="#77756f">第 2 层</text><rect x="393.8" y="529.0" width="252.0" height="11" rx="2" fill="#417a5b" opacity=".5"/><text x="904" y="540" text-anchor="end" font-size="12.5" fill="#98958e">−10.0% → +120.0% · 占 29%</text><text x="56" y="568" font-size="13" fill="#77756f">第 3 层</text><rect x="462.9" y="557.0" width="126.3" height="11" rx="2" fill="#417a5b" opacity=".5"/><text x="904" y="568" text-anchor="end" font-size="12.5" fill="#98958e">+15.0% → +80.0% · 占 14%</text><text x="56" y="596" font-size="13" fill="#77756f">第 4 层（峰顶）</text><rect x="497.5" y="585.0" width="49.6" height="11" rx="2" fill="#417a5b" opacity=".5"/><text x="904" y="596" text-anchor="end" font-size="12.5" fill="#98958e">+30.0% → +55.0% · 占 6%</text>
<text x="56" y="646" font-size="12.5" fill="#9a6a2c">接近现有能力：Curve + 只在现价一侧的区间已经是斜的，但嵌套锚点固定在靠近现价的那条边（shape.ts:22），峰顶推不到区间中间</text>
</svg>