<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 772" width="960" height="772" font-family="-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect width="960" height="772" fill="#fbf9f5"/>
<text x="56" y="40" font-size="20" font-weight="600" fill="#191918">阶梯 / 网格：Step-wise（Ladder）</text>
<text x="56" y="64" font-size="13.5" fill="#77756f">等宽、等厚、互不相邻的 N 档，像网格交易的挂单档位</text>
<text x="56" y="86" font-size="13" fill="#98958e">柱高 = 流动性厚度 · 蓝 = 现价下方（USDG，等跌买入）· 绿 = 上方（代币，等涨卖出）· 横轴为对数价格 · 现价落在第 4 档里</text>
