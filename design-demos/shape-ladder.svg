<text x="480.0" y="402" text-anchor="middle" font-size="13" fill="#98958e">权重全是 1 —— 改成「越远越厚」就是 Bid-Ask，「越近越厚」就是 Curve</text>
<line x1="87.4" y1="340" x2="87.4" y2="346" stroke="#d8d0c2"/><text x="87.4" y="362" text-anchor="middle" font-size="13" fill="#191918">−50%</text>
<line x1="425.6" y1="340" x2="425.6" y2="346" stroke="#d8d0c2"/><text x="425.6" y="362" text-anchor="middle" font-size="13" fill="#191918">现价</text>
<line x1="872.6" y1="340" x2="872.6" y2="346" stroke="#d8d0c2"/><text x="872.6" y="362" text-anchor="middle" font-size="13" fill="#191918">+150%</text>

<line x1="56" y1="428" x2="904" y2="428" stroke="#deddd7"/>
<text x="56" y="450" font-size="13.5" fill="#191918">拆成 8 个仓位</text>
<text x="56" y="476" font-size="13.5" fill="#191918">怎么用：价格每穿过一档，就把那一档整档换成另一种币（等于成交一格网格）。厚度处处相同，不预设价格更愿意待在哪里</text>
<text x="56" y="512" font-size="13" fill="#77756f">第 1 档</text><rect x="237.2" y="501.0" width="38.6" height="11" rx="2" fill="#3565a8" opacity=".5"/><text x="904" y="512" text-anchor="end" font-size="12.5" fill="#98958e">−48.4% → −40.8% · 占 11%</text><text x="56" y="540" font-size="13" fill="#77756f">第 2 档</text><rect x="293.9" y="529.0" width="38.6" height="11" rx="2" fill="#3565a8" opacity=".5"/><text x="904" y="540" text-anchor="end" font-size="12.5" fill="#98958e">−36.9% → −27.6% · 占 13%</text><text x="56" y="568" font-size="13" fill="#77756f">第 3 档</text><rect x="350.6" y="557.0" width="38.6" height="11" rx="2" fill="#3565a8" opacity=".5"/><text x="904" y="568" text-anchor="end" font-size="12.5" fill="#98958e">−22.8% → −11.5% · 占 14%</text><text x="56" y="596" font-size="13" fill="#77756f">第 4 档</text><rect x="407.4" y="585.0" width="38.6" height="11" rx="2" fill="#417a5b" opacity=".5"/><text x="904" y="596" text-anchor="end" font-size="12.5" fill="#98958e">−5.6% → +8.3% · 占 15%</text><text x="56" y="624" font-size="13" fill="#77756f">第 5 档</text><rect x="464.1" y="613.0" width="38.6" height="11" rx="2" fill="#417a5b" opacity=".5"/><text x="904" y="624" text-anchor="end" font-size="12.5" fill="#98958e">+15.5% → +32.4% · 占 14%</text><text x="56" y="652" font-size="13" fill="#77756f">第 6 档</text><rect x="520.8" y="641.0" width="38.6" height="11" rx="2" fill="#417a5b" opacity=".5"/><text x="904" y="652" text-anchor="end" font-size="12.5" fill="#98958e">+41.2% → +61.9% · 占 12%</text><text x="56" y="680" font-size="13" fill="#77756f">第 7 档</text><rect x="577.5" y="669.0" width="38.6" height="11" rx="2" fill="#417a5b" opacity=".5"/><text x="904" y="680" text-anchor="end" font-size="12.5" fill="#98958e">+72.7% → +98.0% · 占 11%</text><text x="56" y="708" font-size="13" fill="#77756f">第 8 档</text><rect x="634.2" y="697.0" width="38.6" height="11" rx="2" fill="#417a5b" opacity=".5"/><text x="904" y="708" text-anchor="end" font-size="12.5" fill="#98958e">+111.1% → +142.1% · 占 10%</text>
<text x="56" y="758" font-size="12.5" fill="#9a6a2c">现在做不到：等于 Bid-Ask 把权重从 k 改成全 1、再留出空隙。可以用多次 Spot 进场手搓出来</text>
